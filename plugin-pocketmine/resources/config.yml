# Galaxium Vocal — configuration
# Adresse du site (sans / à la fin)
site_url: "https://galaxium-vocal.onrender.com"
# Clé secrète : doit être identique à MC_KEY sur Render
key: "change-moi"
# Envoi des positions toutes les X ticks (4 = 5 fois par seconde)
sync_ticks: 4
# Icône du micro en bas à droite (JSON UI, resource pack envoyé automatiquement)
hud: true
# Icône de son à gauche du pseudo au-dessus de la tête (verte quand le joueur parle)
nametag_icon: true
# Ancien indicateur texte dans l'actionbar (désactivé, remplacé par l'icône)
actionbar: false
# Message de bienvenue à la connexion
join_message: true
